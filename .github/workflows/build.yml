name: build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Download Dalamud reference assemblies
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
          Expand-Archive -Force latest.zip "$env:APPDATA\XIVLauncher\addon\Hooks\dev"
          "DALAMUD_HOME=$env:APPDATA\XIVLauncher\addon\Hooks\dev" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Restore
        run: dotnet restore KeyboundCompanion.slnx --locked-mode
      - name: Build
        run: dotnet build KeyboundCompanion.slnx -c Release --no-restore
      - name: Test
        run: dotnet run --project KeyboundClick.Tests/KeyboundClick.Tests.csproj -c Release --no-build
      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: KeyboundClick
          path: KeyboundClick/bin/x64/Release/KeyboundClick/
          if-no-files-found: error
          retention-days: 7
